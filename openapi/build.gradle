plugins {
    id 'io.micronaut.build.internal.openapi-module'
}

dependencies {

    compileOnly(mn.micronaut.core.processor)
    compileOnly(projects.micronautOpenapiAdoc)

    implementation(mn.micronaut.http) {
        exclude group: "io.micronaut", module: "micronaut-core-reactive"
        exclude group: "io.micronaut", module: "micronaut-context"
        exclude group: "io.micronaut", module: "micronaut-context-propagation"
        exclude group: "io.projectreactor", module: "reactor-core"
    }

    api(projects.micronautOpenapiAnnotations)
    api(projects.micronautOpenapiCommon)
    api(mn.jackson.databind)
    api(mn.jackson.dataformat.yaml)
    api(mn.jackson.datatype.jsr310)
    api(libs.managed.swagger.models)
    api(libs.managed.javadoc.parser)
    api(libs.managed.html2md.converter) {
        exclude group: "org.jetbrains", module: "annotations"
    }
    // this dependency needs to be updated manually. It's used by html2md
    api(libs.managed.jsoup)

    testImplementation(projects.micronautOpenapiAdoc)
    testImplementation(mnSession.micronaut.session)
    testImplementation(mn.micronaut.management)
    testImplementation(mn.micronaut.inject.kotlin.test)
    testImplementation(mn.micronaut.inject.groovy.test)
    testImplementation(mn.micronaut.inject.java.test)
    testImplementation(mn.micronaut.http.server)
    testImplementation(mn.snakeyaml)
    testImplementation(mnSecurity.micronaut.security)
    testImplementation(mnSerde.micronaut.serde.jackson)
    testImplementation(mnRxjava2.micronaut.rxjava2)
    testImplementation(mnRxjava3.micronaut.rxjava3)
    testImplementation(mnData.micronaut.data.model)
    testImplementation(mnValidation.validation)
    testImplementation(mnGrpc.protobuf.java)
    testImplementation(libs.jspecify)
    testImplementation(libs.jdt.annotation)
    testImplementation(libs.android.annotation)
    testImplementation(libs.spotbugs.annotations)
    testImplementation(libs.guava)
    testImplementation(mn.kotlinx.coroutines.reactor)

// uncomment it, if you want to test micronaut-openapi with spring-boot actuator locally
//    testAnnotationProcessor(mnSpring.micronaut.spring.annotation)
//    testAnnotationProcessor(mnSpring.micronaut.spring.web.annotation)
//    testAnnotationProcessor(mnSpring.micronaut.spring.boot.annotation)
//    testImplementation(platform("org.springframework.boot:spring-boot-dependencies:${mnSpring.versions.spring.boot.get()}"))
//    testImplementation(libs.spring.boot.starter.web)
//    testImplementation(libs.spring.boot.starter.actuator)
//    testImplementation(libs.micrometer.registry.prometheus)
}

configurations.configureEach {
    exclude group: "ch.qos.logback"
}

test {
    maxParallelForks = Runtime.runtime.availableProcessors()
    maxHeapSize = "2048m"
}

def downloadResources = tasks.register("downloadResources") {
    description = "Downloads all external resources"
}

def t = tasks
[
        "npm/swagger-ui@${libs.versions.js.swagger.ui.get()}/dist/swagger-ui-bundle.js": ["SwaggerUIBundle", "swagger-ui/res/swagger-ui-bundle.js"],
        "npm/swagger-ui@${libs.versions.js.swagger.ui.get()}/dist/swagger-ui-standalone-preset.js": ["SwaggerUIPreset", "swagger-ui/res/swagger-ui-standalone-preset.js"],
        "npm/swagger-ui@${libs.versions.js.swagger.ui.get()}/dist/swagger-ui.css": ["SwaggerUICss", "swagger-ui/res/swagger-ui.css"],
        "npm/openapi-explorer@${libs.versions.js.openapi.explorer.get()}/dist/browser/openapi-explorer.min.js": ["OpenApiExplorer", "openapi-explorer/res/openapi-explorer.min.js"],
        "npm/redoc@${libs.versions.js.redoc.get()}/bundles/redoc.standalone.js": ["Redoc", "redoc/res/redoc.standalone.js"],
        "npm/rapidoc@${libs.versions.js.rapidoc.get()}/dist/rapidoc-min.js": ["Rapidoc", "rapidoc/res/rapidoc-min.js"],
        "npm/rapipdf@${libs.versions.js.rapipdf.get()}/dist/rapipdf-min.js": ["Rapipdf", "rapipdf/res/rapipdf-min.js"],
        "npm/@scalar/api-reference@${libs.versions.js.scalar.get()}/dist/browser/standalone.js": ["Scalar", "scalar/res/standalone.js"],
].each { file, info -> {
    def taskName = "download${info[0]}".toString()
    def targetPath = info[1]
    def download = t.register(taskName, io.micronaut.build.internal.openapi.RemoteDownloadTask) {
        baseUrl = "https://cdn.jsdelivr.net"
        contentPath = file
        outputPath = "templates/$targetPath"
        outputDirectory = layout.buildDirectory.dir("downloads/$taskName")
    }
    downloadResources.configure {
        dependsOn(download)
    }
    sourceSets.main.resources.srcDir(download)
}}
