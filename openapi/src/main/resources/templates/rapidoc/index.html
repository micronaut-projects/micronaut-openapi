<!doctype html>
<!-- Important: must specify, else rendering will be effected -->
<html lang="en">
    <head>
        <title>{{title}}</title>
        <!-- Important: The Custom element uses utf8 characters -->
        <meta charset='utf-8' />
        <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1,user-scalable=yes">
    </head>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const docEl = document.getElementById('rapidoc');
            docEl.addEventListener('before-try', (e) => {
                e.detail.request.headers.append('AAA-BBB', 'CCC DDDD');
            });
        });
    </script>
    <body>
        <rapi-doc id='rapidoc' {{rapidoc.attributes}}>{{rapipdf.tag}}</rapi-doc>
        <script>
            const extract = function(v) {
                return decodeURIComponent(v.replace(/(?:^|.*;\s*)contextPath\s*=\s*([^;]*).*$|^.*$/, "$1"));
            }
            const cookie = extract(document.cookie)
            contextPath = cookie === '' ? extract(window.location.search.substring(1)) : cookie;
            if (!isSafeContextPath(contextPath)) {
                contextPath = '';
            }
            const head = document.getElementsByTagName('head')[0];
            {{rapipdf.script}}
            const rapidocJs = script(contextPath + "{{rapidoc.js.url.prefix}}rapidoc-min.js", head, true)

            rapidocJs.onload = function () {

                const rapidoc = document.getElementById('rapidoc')
                if (contextPath !== '') {
                    rapidoc.addEventListener('spec-loaded', e => {
                        e.detail.tags.forEach(tag => tag.paths.forEach(path => path.path = contextPath + path.path));
                        rapidoc.requestUpdate();
                    });
                }
                rapidoc.setAttribute('spec-url', contextPath + '{{specURL}}');
                {{rapipdf.specurl}}
            }

            function script(src, head, type, defer) {
                const el = document.createElement('script');
                el.src = src;
                if (defer !== undefined && defer) {
                    el.setAttribute("defer", "");
                }
                head.appendChild(el);
                return el;
            }
            function isSafeContextPath(cp) {
                if (typeof cp !== 'string') return false;
                cp = cp.trim();
                if (cp === '') return true; // allow empty = root

                try {
                    // Build against current origin to normalize
                    const u = new URL(cp, window.location.origin);

                    // Must be same origin and http(s)
                    if (u.origin !== window.location.origin) return false;
                    if (!(u.protocol === 'http:' || u.protocol === 'https:')) return false;

                    // Path only: no query or fragment
                    if (u.search !== '' || u.hash !== '') return false;

                    const p = u.pathname;

                    // Must start with a single slash and contain only safe path chars
                    if (!p.startsWith('/')) return false;
                    if (!/^\/[A-Za-z0-9._~\-\/]*$/.test(p)) return false;

                    // Disallow protocol relative indicators traversal and HTML breaking chars
                    if (p.includes('//') || p.includes('..')) return false;
                    if (/[<>"'`\\]/.test(p)) return false;

                    return true;
                } catch {
                    return false;
                }
            }
        </script>
    </body>
</html>
