<!doctype html>
<html lang='en'>

<head>
    <meta charset='UTF-8' />
    <title>{{title}}</title>
</head>

<body>
    {{rapipdf.tag}}
    <div id='swagger-ui'></div>
    <script>

        const extract = function(v) {
            return decodeURIComponent(v.replace(/(?:^|.*;\s*)contextPath\s*=\s*([^;]*).*$|^.*$/, "$1"));
        };
        const cookie = extract(document.cookie);
        contextPath = cookie === '' ? extract(window.location.search.substring(1)) : cookie;
        if (!isSafeContextPath(contextPath)) {
            contextPath = '';
        }
        const head = document.getElementsByTagName('head')[0]

        link(contextPath + "{{swagger-ui.js.url.prefix}}swagger-ui.css", head, "text/css", "stylesheet")
        link(contextPath + "{{swagger-ui.js.url.prefix}}favicon-16x16.png", head, "image/png", "icon", "16x16")
        link(contextPath + "{{swagger-ui.js.url.prefix}}favicon-32x32.png", head, "image/png", "icon", "32x32")
        {{swagger-ui.theme}}
        {{rapipdf.script}}
        window.onload = function() {
            const swaggerUiBundle = script(contextPath + "{{swagger-ui.js.url.prefix}}swagger-ui-bundle.js", head)
            const swaggerUiStandalonePreset = script(contextPath + "{{swagger-ui.js.url.prefix}}swagger-ui-standalone-preset.js", head)

            swaggerUiBundle.onload = function () {
                if (typeof (SwaggerUIStandalonePreset) == "undefined") {
                    swaggerUiStandalonePreset.onload = function () {
                        initializeSwaggerUI();
                    };
                } else {
                    initializeSwaggerUI()
                }
            };
        };

        function initializeSwaggerUI() {
            const f = contextPath === '' ? undefined : () => {
                return {
                    statePlugins: {
                        spec: {
                            wrapActions: {
                                updateJsonSpec: (oriAction) => (...args) => {
                                    let [spec] = args;
                                    if (spec && spec.paths) {
                                        const newPaths = {};
                                        Object.entries(spec.paths).forEach(([path, value]) => newPaths[contextPath + path] = value);
                                        spec.paths = newPaths;
                                    }
                                    oriAction(...args);
                                }
                            }
                        }
                    }
                };
            };
            const ui = SwaggerUIBundle({
                url: contextPath + '{{specURL}}',
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl,
                    f
                ],
                {{swagger-ui.primaryName}}
                {{swagger-ui.urls}}
                {{swagger-ui.attributes}}
            });
            {{swagger-ui.oauth2}}
            window.ui = ui;
            {{rapipdf.specurl}}
        }

        function link(href, head, type, rel, sizes) {
            const el = document.createElement('link');
            el.href = href;
            el.type = type;
            el.rel = rel;
            if (sizes !== undefined && sizes) {
                el.sizes = sizes;
            }
            head.appendChild(el);
        }

        function script(src, head) {
            const el = document.createElement('script');
            el.src = src;
            head.appendChild(el);
            return el;
        }
        function isSafeContextPath(cp) {
            if (typeof cp !== 'string') return false;
            cp = cp.trim();
            if (cp === '') return true; // allow empty = root

            try {
                // Build against current origin to normalize
                const u = new URL(cp, window.location.origin);

                // Must be same origin and http(s)
                if (u.origin !== window.location.origin) return false;
                if (!(u.protocol === 'http:' || u.protocol === 'https:')) return false;

                // Path only: no query or fragment
                if (u.search !== '' || u.hash !== '') return false;

                const p = u.pathname;

                // Must start with a single slash and contain only safe path chars
                if (!p.startsWith('/')) return false;
                if (!/^\/[A-Za-z0-9._~\-\/]*$/.test(p)) return false;

                // Disallow protocol relative indicators traversal and HTML breaking chars
                if (p.includes('//') || p.includes('..')) return false;
                if (/[<>"'`\\]/.test(p)) return false;

                return true;
            } catch {
                return false;
            }
        }
    </script>
</body>

</html>
