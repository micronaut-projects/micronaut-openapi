openapi: 3.0.3
info:
  version: 1.0.0
  title: date-time problem API
paths:
  /example:
    get:
      summary: Get example object
      responses:
        '200':
          description: resppnseWithObjectWithLocalDateTime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectWithLocalDateTime'
components:
  schemas:
    ObjectWithLocalDateTime:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2025-05-26T14:00:00'
          default: '2025-05-26T14:00:00Z'
