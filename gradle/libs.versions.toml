jackson = "2.22.2"
openapi-generator = "7.24.0"
swagger-parser = "1.0.76"
swagger-parser-v3 = "2.1.47"
javaparser = "3.28.2"
commons-lang3 = "3.20.0"
commons-codec = "1.22.0"
commons-io = "2.22.0"
commons-text = "1.15.0"
guava = "33.6.0-jre"
commonmark = "0.29.0"
kotlin-compile-testing = "0.13.0"
micronaut-platform = "5.1.0"
micronaut = "5.1.10"
